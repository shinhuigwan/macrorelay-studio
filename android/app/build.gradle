plugins {
    id "com.android.application"
}

android {
    namespace "studio.macrorelay.remote"
    compileSdk 35

    defaultConfig {
        applicationId "studio.macrorelay.remote"
        minSdk 24
        targetSdk 35
        versionCode 22300
        versionName "2.23.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
