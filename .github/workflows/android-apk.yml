name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.MACRORELAY_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/macrorelay-release.jks"
      - name: Build installable APK
        working-directory: android
        env:
          MACRORELAY_KEYSTORE_PATH: ${{ runner.temp }}/macrorelay-release.jks
          MACRORELAY_KEYSTORE_PASSWORD: ${{ secrets.MACRORELAY_KEYSTORE_PASSWORD }}
          MACRORELAY_KEY_ALIAS: ${{ secrets.MACRORELAY_KEY_ALIAS }}
          MACRORELAY_KEY_PASSWORD: ${{ secrets.MACRORELAY_KEY_PASSWORD }}
        run: bash gradlew assembleRelease
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MacroRelay-Remote-${GITHUB_REF_NAME}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MacroRelay-Remote-APK
          path: MacroRelay-Remote-${{ github.ref_name }}.apk
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MacroRelay-Remote-${{ github.ref_name }}.apk
