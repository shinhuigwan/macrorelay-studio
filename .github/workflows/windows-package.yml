name: Windows Install Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build installer-ready source package
        shell: pwsh
        run: |
          git archive --format=zip --prefix=MacroRelay-Studio/ --output="MacroRelay-Studio-${{ github.ref_name }}.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: MacroRelay-Studio-Windows
          path: MacroRelay-Studio-${{ github.ref_name }}.zip
      - name: Attach package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MacroRelay-Studio-${{ github.ref_name }}.zip

