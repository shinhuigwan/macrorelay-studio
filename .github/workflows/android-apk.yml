name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable APK
        working-directory: android
        run: bash gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MacroRelay-Remote-${GITHUB_REF_NAME}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MacroRelay-Remote-APK
          path: MacroRelay-Remote-${{ github.ref_name }}.apk
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MacroRelay-Remote-${{ github.ref_name }}.apk
