plugins {
    id "com.android.application"
}

def releaseKeystore = System.getenv("MACRORELAY_KEYSTORE_PATH")

android {
    namespace "studio.macrorelay.remote"
    compileSdk 35

    defaultConfig {
        applicationId "studio.macrorelay.remote"
        minSdk 24
        targetSdk 35
        versionCode 22301
        versionName "2.23.1"
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("MACRORELAY_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MACRORELAY_KEY_ALIAS")
                keyPassword System.getenv("MACRORELAY_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
